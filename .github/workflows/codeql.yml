name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - frontend/node_modules
              - frontend/dist
              - backend/internal/spa/dist

      # go.mod ada di backend/, bukan di root, jadi autobuild tidak menemukannya. Semua paket, termasuk
      # cmd/server, cmd/worker, dan cmd/dbmpctl, di-build supaya seluruh kode Go masuk database CodeQL.
      - if: matrix.build-mode == 'manual'
        working-directory: backend
        run: go build ./...

      # Repo private tanpa GitHub Advanced Security tidak bisa menerima upload ke tab Security, jadi hasil
      # hanya disimpan sebagai artifact. Repo public meng-upload ke tab Security dan tetap menyimpan artifact.
      # Visibilitas dibaca lewat API karena payload event schedule tidak berisi data repository.
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: ${{ steps.visibility.outputs.private == 'true' && 'never' || 'always' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 90
