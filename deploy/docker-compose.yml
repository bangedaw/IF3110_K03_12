name: dbmp

# Satu origin untuk dev: platform DB + 2 target PostgreSQL + 1 target MySQL.
# Seed dimuat otomatis saat container pertama dibuat (mount ke /docker-entrypoint-initdb.d).
# Ulangi seed: `make reseed` (menghapus volume lalu dibuat ulang).

services:
  platform-db:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmp
      POSTGRES_PASSWORD: dbmp
      POSTGRES_DB: dbmp
    ports:
      - "5432:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmp -d dbmp"]
      interval: 2s
      timeout: 3s
      retries: 30

  target-pg-1:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmp
      POSTGRES_PASSWORD: dbmp
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    volumes:
      - ./seed/pg1.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - target-pg-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmp -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  target-pg-2:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmp
      POSTGRES_PASSWORD: dbmp
      POSTGRES_DB: inventory
    ports:
      - "5434:5432"
    volumes:
      - ./seed/pg2.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - target-pg-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmp -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  target-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sales
      MYSQL_USER: dbmp
      MYSQL_PASSWORD: dbmp
    ports:
      - "3307:3306"
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - target-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  platform-db-data:
  target-pg-1-data:
  target-pg-2-data:
  target-mysql-data:
