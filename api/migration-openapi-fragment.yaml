paths:
  /api/databases/{databaseId}/migrations:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      operationId: listMigrations
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, applied] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Migration list
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Migration' } }
                  limit: { type: integer }
                  offset: { type: integer }
                  total: { type: integer }
    post:
      operationId: createMigration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationCreate' }
      responses:
        '201': { description: Draft created }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/databases/{databaseId}/migrations/{migrationId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - name: migrationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMigration
      responses:
        '200': { description: Migration detail, content: { application/json: { schema: { $ref: '#/components/schemas/Migration' } } }
    patch:
      operationId: updateMigrationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationUpdate' }
      responses:
        '200': { description: Draft updated }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMigrationDraft
      parameters:
        - in: query
          name: revision
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /api/databases/{databaseId}/migrations/{migrationId}/execute:
    post:
      operationId: executeMigration
      parameters:
        - $ref: '#/components/parameters/DatabaseId'
        - name: migrationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationExecute' }
      responses:
        '200': { description: Execution run }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/databases/{databaseId}/migrations/{migrationId}/runs:
    get:
      operationId: listMigrationRuns
      parameters:
        - $ref: '#/components/parameters/DatabaseId'
        - name: migrationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Execution runs }
  /api/databases/{databaseId}/history:
    get:
      operationId: getMigrationHistory
      parameters:
        - $ref: '#/components/parameters/DatabaseId'
      responses:
        '200': { description: Applied versions and failed runs }
  /api/databases/{databaseId}/migrations/{migrationId}/explain:
    post:
      operationId: explainMigration
      parameters:
        - $ref: '#/components/parameters/DatabaseId'
        - name: migrationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationExplain' }
      responses:
        '200': { description: Explain plan }
        '403': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    DatabaseId:
      name: databaseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Migration:
      type: object
      required: [id, databaseId, title, description, sql, checksum, status, baseVersion, revision, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        databaseId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        sql: { type: string }
        checksum: { type: string }
        status: { type: string, enum: [draft, applied] }
        version: { type: integer, nullable: true }
        baseVersion: { type: integer }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MigrationCreate:
      type: object
      required: [title, sql]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        sql: { type: string, minLength: 1 }
    MigrationUpdate:
      allOf:
        - $ref: '#/components/schemas/MigrationCreate'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1 }
    MigrationExecute:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        acknowledgeHeadChanged: { type: boolean, default: false }
    MigrationExplain:
      type: object
      required: [analyze]
      properties:
        analyze: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: array, items: { type: object } }
