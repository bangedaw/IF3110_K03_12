openapi: 3.0.3
info:
  title: Database Management Platform API
  version: 0.1.0
  description: |
    Konvensi:
    - Semua endpoint di bawah /api, JSON camelCase, waktu ISO 8601 UTC, ID berupa number (int64).
    - Error memakai RFC 9457 Problem Details (`application/problem+json`), lihat schema Problem.
    - Session via cookie HttpOnly `dbmp_session` (tidak pernah ada di body/URL).
    - Semua request POST/PUT/PATCH/DELETE wajib header `X-CSRF-Token` berisi csrfToken
      dari /api/auth/login atau /api/auth/me. Tanpa/salah → 403 CSRF_INVALID.
    - Pagination: `?limit=&offset=` → `{ items, limit, offset, total? }`.
servers:
  - url: /
security:
  - cookieAuth: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login dengan username dan password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil; cookie session di-set via Set-Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout dan revoke session saat ini
      responses:
        '204': { description: Logout berhasil }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: User yang sedang login + csrfToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/admin/users:
    get:
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      description: >
        Menonaktifkan user (isActive=false) me-revoke semua session-nya. Ditolak (409) jika user masih
        menjadi leader group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      description: Ditolak (409) untuk akun sendiri atau jika user masih menjadi leader group.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin]
      summary: Reset password user (me-revoke semua session user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordReset' }
      responses:
        '204': { description: Password direset }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/admin/users/{userId}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin]
      summary: Revoke semua session user
      responses:
        '204': { description: Session di-revoke }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/groups:
    get:
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/admin/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [admin]
      responses:
        '200':
          description: Group beserta anggotanya
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [admin]
      summary: Tambah user ke group (idempoten)
      responses:
        '204': { description: Anggota ditambahkan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Keluarkan user dari group
      description: Leader tidak bisa dikeluarkan (409) sebelum leader lain ditunjuk.
      responses:
        '204': { description: Anggota dikeluarkan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/groups/{groupId}/leader:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      tags: [admin]
      summary: Tunjuk leader group
      description: >
        Leader harus anggota group dan user yang aktif. Leader lama tetap menjadi anggota. Leader menyetujui
        setiap migration pada database yang bisa diakses group-nya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupLeaderSet' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/groups/{groupId}/grants:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Grant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/groups/{groupId}/grants/{databaseId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/DatabaseId'
    put:
      tags: [admin]
      summary: Set level akses group pada database (buat atau ubah)
      description: >
        Menambah akses (grant baru atau naik ke edit) ditolak (409) untuk group yang belum punya leader,
        karena migration pada database itu tidak akan bisa disetujui. Menurunkan akses tetap boleh.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantUpsert' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      responses:
        '204': { description: Grant dicabut }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===== [Edo] Koneksi database target =====
  /api/admin/databases:
    get:
      tags: [connections]
      summary: Daftar koneksi (Platform Admin)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseConnectionPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [connections]
      summary: Tambah koneksi; password disimpan terenkripsi dan tidak pernah dikembalikan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseConnectionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/admin/databases/test:
    post:
      tags: [connections]
      summary: Uji koneksi sebelum disimpan (tidak menyimpan apa pun)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseConnectionTestRequest' }
      responses:
        '200':
          description: Koneksi berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DBUnreachable' }
  /api/admin/databases/{databaseId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [connections]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [connections]
      description: Password kosong berarti tidak diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseConnectionUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [connections]
      responses:
        '204': { description: Koneksi dihapus }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/databases/{databaseId}/test:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    post:
      tags: [connections]
      summary: Uji koneksi tersimpan
      responses:
        '200':
          description: Koneksi berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DBUnreachable' }

  /api/databases:
    get:
      tags: [explorer]
      summary: Daftar database target yang boleh dilihat user (EffectiveLevel bukan none dan koneksi aktif)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExplorerDatabase' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/databases/{databaseId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [explorer]
      summary: Detail satu database target
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplorerDatabaseDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/databases/{databaseId}/schemas:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [explorer]
      summary: Daftar schema (non-sistem) pada database target
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaNameList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DBUnreachable' }
  /api/databases/{databaseId}/schemas/{schemaName}/tables:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - $ref: '#/components/parameters/SchemaName'
    get:
      tags: [explorer]
      summary: Daftar tabel pada schema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExplorerTableSummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DBUnreachable' }
  /api/databases/{databaseId}/schemas/{schemaName}/tables/{tableName}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - $ref: '#/components/parameters/SchemaName'
      - $ref: '#/components/parameters/TableName'
    get:
      tags: [explorer]
      summary: Deskripsi tabel (kolom, constraint, index)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplorerTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DBUnreachable' }
  /api/databases/{databaseId}/schemas/{schemaName}/tables/{tableName}/rows:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - $ref: '#/components/parameters/SchemaName'
      - $ref: '#/components/parameters/TableName'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      tags: [explorer]
      summary: Halaman baris data (read-only); nilai sel sudah diserialisasi aman
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplorerRowsPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DBUnreachable' }

  /api/databases/{databaseId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [explorer]
      summary: Daftar snapshot schema tersimpan untuk database ini
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SchemaSnapshot' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [explorer]
      summary: Ambil snapshot schema terkini dari target hidup lalu simpan
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DBUnreachable' }
  /api/databases/{databaseId}/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [explorer]
      summary: Ambil satu snapshot (terkunci pada database; lintas database -> 404)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/databases/{databaseId}/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Status job eksekusi migration (terkunci pada database; lintas database -> 404)
      description: Butuh akses View Only atau View + Edit ke database. Dipakai SPA untuk memantau progres.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/databases/{databaseId}/schema-diff:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    post:
      tags: [explorer]
      summary: Bandingkan skema hidup database ini dengan pembanding; hasilkan SQL toTarget
      description: |
        Butuh view di kedua sisi (databaseId dan against); snapshot terkunci pada
        databaseId (lintas database -> 404). Menyimpan hasil sebagai draft
        migration dilakukan lewat endpoint migrations (Rhino).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemaDiffRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaDiffResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: VALIDATION_FAILED (direction/against tidak valid)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DBUnreachable' }

  /api/databases/{databaseId}/migrations:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [migrations]
      summary: Daftar migration database, terbaru lebih dulu (View Only cukup)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Migration' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [migrations]
      summary: Buat migration draft (butuh View + Edit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationDefinition' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/databases/{databaseId}/migration-history:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'
    get:
      tags: [migrations]
      summary: Riwayat eksekusi, satu baris per attempt (berhasil dan gagal), terbaru lebih dulu
      parameters:
        - name: hideRollback
          in: query
          description: Sembunyikan pasangan eksekusi yang dibatalkan dan rollback sukses yang membatalkannya. Attempt gagal tetap tampil.
          schema: { type: boolean, default: false }
        - name: migrationId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MigrationExecution' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/migrations/{migrationId}:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [migrations]
      summary: Detail migration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [migrations]
      summary: Ubah draft (revisi naik); SQL yang pernah dieksekusi tidak bisa diubah
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [migrations]
      summary: Hapus draft yang belum pernah dieksekusi
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/migrations/{migrationId}/submit:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      summary: Ajukan penerapan draft ke review
      responses:
        '201':
          description: Request approval dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/migrations/{migrationId}/rollback:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      summary: Ajukan rollback (migration aktif terakhir, atau batch yang masih partial)
      responses:
        '201':
          description: Request approval dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/migrations/{migrationId}/forward:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      summary: Ajukan forward (migration yang paling akhir di-rollback)
      responses:
        '201':
          description: Request approval dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/migrations/{migrationId}/approvals:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [migrations]
      summary: Approval setiap group untuk request terakhir
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationApprovals' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [migrations]
      summary: Setuju atau tolak sebagai leader group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationDecision' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Migration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/migrations/{migrationId}/execute:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      summary: Masukkan request yang sudah disetujui ke antrean
      description: Request yang gagal atau partial diantrekan ulang tanpa approval baru, batch dilanjutkan dari checkpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationExecute' }
      responses:
        '202':
          description: Job dibuat atau diantrekan ulang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/migrations/{migrationId}/explain:
    parameters:
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [migrations]
      summary: EXPLAIN SQL up di database target tanpa menyimpan perubahan (butuh View + Edit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationExplain' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MigrationPlan' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DBUnreachable' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dbmp_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DatabaseId:
      name: databaseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SchemaName:
      name: schemaName
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    TableName:
      name: tableName
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Unauthenticated:
      description: Belum login atau session berakhir (UNAUTHENTICATED / SESSION_EXPIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Login tetapi tidak berhak (FORBIDDEN / CSRF_INVALID)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Konflik (duplikat atau revisi basi)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Input tidak valid; detail per field ada di `errors`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DBUnreachable:
      description: Database target tidak terjangkau (DB_UNREACHABLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Forbidden }
        status: { type: integer, example: 403 }
        detail: { type: string }
        code:
          type: string
          description: Kode error aplikasi
          enum: [UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, CSRF_INVALID, NOT_FOUND,
                 VALIDATION_FAILED, CONFLICT, DB_UNREACHABLE, MIGRATION_FAILED,
                 METHOD_NOT_ALLOWED, INTERNAL]
        errors:
          type: object
          description: Pesan error per field (hanya VALIDATION_FAILED)
          additionalProperties: { type: string }
    AccessLevel:
      type: string
      enum: [view, edit]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    AuthSession:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
    User:
      type: object
      required: [id, username, displayName, isPlatformAdmin, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        isPlatformAdmin: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, format: password, minLength: 8, maxLength: 256 }
        isPlatformAdmin: { type: boolean, default: false }
    UserUpdate:
      type: object
      description: Field yang tidak dikirim tidak diubah.
      properties:
        displayName: { type: string, maxLength: 128 }
        isPlatformAdmin: { type: boolean }
        isActive: { type: boolean }
    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 8, maxLength: 256 }
    UserPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }
    Group:
      type: object
      required: [id, name, description, createdAt, leaderId, leaderUsername]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        leaderId:
          type: integer
          format: int64
          nullable: true
          description: Kosong hanya untuk group dari Milestone 1 yang belum ditunjuk leader-nya.
        leaderUsername: { type: string, nullable: true }
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/User' }
    GroupCreate:
      type: object
      required: [name, leaderId]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 512 }
        leaderId:
          type: integer
          format: int64
          description: User aktif yang menjadi leader sekaligus anggota pertama group.
    GroupLeaderSet:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64 }
    GroupUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 512 }
    GroupPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }
    Grant:
      type: object
      required: [databaseId, databaseName, level]
      properties:
        databaseId: { type: integer, format: int64 }
        databaseName: { type: string }
        level: { $ref: '#/components/schemas/AccessLevel' }
    GrantUpsert:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/AccessLevel' }

    # ===== [Edo] Koneksi database target =====
    DBMSKind:
      type: string
      enum: [postgres, mysql]
    SSLMode:
      type: string
      enum: [disable, require, verify-ca, verify-full]
    DatabaseConnection:
      type: object
      description: Password tidak pernah dikembalikan; `hasPassword` hanya menandai ada/tidak.
      required: [id, name, kind, host, port, databaseName, username, sslMode, isActive, hasPassword, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DBMSKind' }
        host: { type: string }
        port: { type: integer }
        databaseName: { type: string }
        username: { type: string }
        sslMode: { $ref: '#/components/schemas/SSLMode' }
        isActive: { type: boolean }
        hasPassword: { type: boolean }
        createdById: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DatabaseConnectionCreate:
      type: object
      required: [name, kind, host, port, databaseName, username, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { $ref: '#/components/schemas/DBMSKind' }
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        databaseName: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, format: password, minLength: 1, maxLength: 512 }
        sslMode: { $ref: '#/components/schemas/SSLMode' }
        isActive: { type: boolean, default: true }
    DatabaseConnectionUpdate:
      type: object
      description: Field yang tidak dikirim tidak diubah. Password kosong berarti tidak diubah.
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { $ref: '#/components/schemas/DBMSKind' }
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        databaseName: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, format: password, maxLength: 512 }
        sslMode: { $ref: '#/components/schemas/SSLMode' }
        isActive: { type: boolean }
    DatabaseConnectionTestRequest:
      description: Kredensial untuk diuji; bisa dari form tambah atau koneksi tersimpan.
      oneOf:
        - $ref: '#/components/schemas/DatabaseConnectionCreate'
        - type: object
          required: [databaseId]
          properties:
            databaseId: { type: integer, format: int64 }
    ConnectionTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        detail: { type: string }
    DatabaseConnectionPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DatabaseConnection' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    ExplorerDatabase:
      type: object
      required: [id, name, kind, isActive, level]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [postgres, mysql]
        isActive: { type: boolean }
        level: { $ref: '#/components/schemas/AccessLevel' }
    ExplorerDatabaseDetail:
      allOf:
        - $ref: '#/components/schemas/ExplorerDatabase'
        - type: object
          required: [host, port, databaseName, sslMode]
          properties:
            host: { type: string }
            port: { type: integer }
            databaseName: { type: string }
            sslMode: { $ref: '#/components/schemas/SSLMode' }
    SchemaNameList:
      type: array
      items: { type: string }
    ExplorerTableSummary:
      type: object
      required: [schema, name, kind, rowEstimate]
      properties:
        schema: { type: string }
        name: { type: string }
        kind: { type: string, enum: [table, view] }
        rowEstimate:
          type: integer
          format: int64
          description: Perkiraan jumlah baris (reltuples; 0 bila belum pernah ANALYZE)
    ExplorerColumn:
      type: object
      required: [name, dataType, nullable, ordinal]
      properties:
        name: { type: string }
        dataType: { type: string, description: Tipe kanonik ternormalisasi }
        rawType: { type: string, description: Tipe mentah dari DBMS }
        nullable: { type: boolean }
        default: { type: string }
        isIdentity: { type: boolean }
        isGenerated: { type: boolean }
        ordinal: { type: integer }
    ExplorerConstraint:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [primary_key, foreign_key, unique, check]
        columns: { type: array, items: { type: string } }
        definition: { type: string, description: Hasil pg_get_constraintdef apa adanya }
        refSchema: { type: string }
        refTable: { type: string }
        refColumns: { type: array, items: { type: string } }
        onUpdate: { type: string }
        onDelete: { type: string }
    ExplorerIndex:
      type: object
      required: [name, unique, primary]
      properties:
        name: { type: string }
        columns: { type: array, items: { type: string } }
        unique: { type: boolean }
        primary: { type: boolean }
        method: { type: string }
        definition: { type: string, description: Hasil pg_get_indexdef apa adanya }
    ExplorerTable:
      type: object
      required: [schema, name, kind, rowEstimate]
      properties:
        schema: { type: string }
        name: { type: string }
        kind: { type: string, enum: [table, view] }
        rowEstimate: { type: integer, format: int64 }
        columns: { type: array, items: { $ref: '#/components/schemas/ExplorerColumn' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/ExplorerConstraint' } }
        indexes: { type: array, items: { $ref: '#/components/schemas/ExplorerIndex' } }
    ExplorerCell:
      type: object
      required: [value, isNull]
      properties:
        value:
          type: string
          description: Nilai sebagai teks (bytea hex, numeric string, dst); kosong bila isNull
        isNull: { type: boolean }
        truncated:
          type: boolean
          description: true bila nilai dipotong pada batas tampilan
    ExplorerRowsPage:
      type: object
      required: [columns, rows, totalEstimate, limit, offset]
      properties:
        columns: { type: array, items: { type: string } }
        rows:
          type: array
          items: { type: array, items: { $ref: '#/components/schemas/ExplorerCell' } }
        totalEstimate: { type: integer, format: int64 }
        limit: { type: integer, maximum: 200 }
        offset: { type: integer }
    ExplorerSchemaObject:
      type: object
      required: [name, tables]
      properties:
        name: { type: string }
        tables: { type: array, items: { $ref: '#/components/schemas/ExplorerTable' } }
    ExplorerSchemaModel:
      description: Model kanonik seluruh schema sebuah database (hasil normalisasi)
      type: object
      required: [schemas]
      properties:
        schemas: { type: array, items: { $ref: '#/components/schemas/ExplorerSchemaObject' } }
    SchemaSnapshot:
      type: object
      required: [id, databaseId, takenAt, model]
      properties:
        id: { type: integer, format: int64 }
        databaseId: { type: integer, format: int64 }
        migrationRunId: { type: integer, format: int64 }
        takenBy: { type: integer, format: int64 }
        takenAt: { type: string, format: date-time }
        model: { $ref: '#/components/schemas/ExplorerSchemaModel' }

    Job:
      type: object
      required: [id, requestId, databaseId, kind, status, attempts, maxAttempts, batchesCommitted, rowsCommitted, createdAt]
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: integer, format: int64 }
        databaseId: { type: integer, format: int64 }
        kind:
          type: string
          enum: [apply, rollback, forward]
          description: Jenis request. Status partial pada rollback berarti sebagian batch sudah dibatalkan (partially reverted).
        status: { type: string, enum: [pending, running, succeeded, failed, partial] }
        attempts: { type: integer, description: Jumlah attempt yang sudah dimulai }
        maxAttempts: { type: integer }
        batchesCommitted: { type: integer, description: Batch yang saat ini ter-commit di database target (mode batch) }
        rowsCommitted: { type: integer, format: int64 }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        runAfter:
          type: string
          format: date-time
          description: Hanya ada saat status pending. Waktu paling cepat worker mengambil attempt berikutnya (jeda retry atau menunggu lock).

    MigrationKind: { type: string, enum: [apply, rollback, forward] }
    MigrationStatus:
      type: string
      enum: [draft, pending_review, approved, rejected, queued, running, succeeded, failed, partial]
      description: Status workflow dari request terakhir. draft berarti belum ada request untuk revisi ini.
    MigrationPosition:
      type: string
      enum: [draft, applied, rolled_back]
      description: Posisi migration di riwayat linear database.
    MigrationAction: { type: string, enum: [edit, delete, submit, execute, rollback, forward, explain] }
    MigrationBatch:
      type: object
      required: [schema, table, column, size]
      properties:
        schema: { type: string, maxLength: 63 }
        table: { type: string, maxLength: 63 }
        column: { type: string, maxLength: 63, description: Kolom integer unik yang tidak berubah }
        size: { type: integer, minimum: 1, maximum: 1000000 }
    MigrationDefinition:
      type: object
      required: [title, upSql, downSql, irreversible, irreversibleReason]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        upSql: { type: string }
        downSql: { type: string, description: Kosong jika irreversible }
        irreversible: { type: boolean }
        irreversibleReason: { type: string, maxLength: 2000, description: Wajib jika irreversible }
        batch: { $ref: '#/components/schemas/MigrationBatch' }
    MigrationUpdate:
      allOf:
        - $ref: '#/components/schemas/MigrationDefinition'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, description: Revisi yang dibaca pengguna sebelum mengubah }
    MigrationRequest:
      type: object
      required: [id, kind, status, revision, requestedByName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/MigrationKind' }
        status: { $ref: '#/components/schemas/MigrationStatus' }
        revision: { type: integer }
        requestedByName: { type: string }
        createdAt: { type: string, format: date-time }
        jobId: { type: integer, format: int64 }
    Migration:
      type: object
      required: [id, databaseId, title, description, status, position, revision, upSql, downSql, irreversible, irreversibleReason, sqlLocked, createdByName, createdAt, updatedAt, actions]
      properties:
        id: { type: integer, format: int64 }
        databaseId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/MigrationStatus' }
        position: { $ref: '#/components/schemas/MigrationPosition' }
        version: { type: integer, description: Versi database setelah migration ini, hanya ada saat applied }
        revision: { type: integer }
        upSql: { type: string }
        downSql: { type: string }
        irreversible: { type: boolean }
        irreversibleReason: { type: string }
        batch: { $ref: '#/components/schemas/MigrationBatch' }
        sqlLocked: { type: boolean, description: true setelah pernah dieksekusi }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        request: { $ref: '#/components/schemas/MigrationRequest' }
        executableRequestId: { type: integer, format: int64, description: Request yang dijalankan oleh aksi execute }
        jobId: { type: integer, format: int64, description: Job dari request terakhir yang tidak ditolak }
        actions:
          type: array
          items: { $ref: '#/components/schemas/MigrationAction' }
          description: Aksi yang saat ini sah untuk pengguna ini
    MigrationExecution:
      type: object
      required: [id, migrationId, migrationTitle, revision, kind, status, attempt, executedBy, executedByName, executedSql, startedAt]
      properties:
        id: { type: integer, format: int64 }
        migrationId: { type: integer, format: int64 }
        migrationTitle: { type: string }
        version: { type: integer }
        revision: { type: integer }
        kind: { $ref: '#/components/schemas/MigrationKind' }
        status: { type: string, enum: [running, succeeded, failed] }
        attempt: { type: integer }
        executedBy: { type: integer, format: int64 }
        executedByName: { type: string }
        executedSql: { type: string }
        revertsExecutionId: { type: integer, format: int64 }
        jobId: { type: integer, format: int64 }
        errorCode: { type: string, description: SQLSTATE jika ada }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    MigrationApprovalDecision: { type: string, enum: [pending, approved, rejected] }
    MigrationApproval:
      type: object
      required: [groupId, groupName, decision, comment]
      properties:
        groupId: { type: integer, format: int64 }
        groupName: { type: string }
        leaderName: { type: string, description: Kosong jika group belum punya leader }
        decision: { $ref: '#/components/schemas/MigrationApprovalDecision' }
        decidedByName: { type: string }
        comment: { type: string }
        decidedAt: { type: string, format: date-time }
    MigrationApprovals:
      type: object
      required: [request, groups, canDecide]
      properties:
        request: { $ref: '#/components/schemas/MigrationRequest' }
        groups: { type: array, items: { $ref: '#/components/schemas/MigrationApproval' } }
        canDecide: { type: boolean }
    MigrationDecision:
      type: object
      required: [requestId, decision]
      properties:
        requestId: { type: integer, format: int64 }
        decision: { type: string, enum: [approved, rejected] }
        comment: { type: string, maxLength: 2000 }
    MigrationExecute:
      type: object
      required: [requestId]
      properties:
        requestId: { type: integer, format: int64 }
    MigrationJob:
      type: object
      required: [jobId]
      properties:
        jobId: { type: integer, format: int64 }
    MigrationExplain:
      type: object
      required: [analyze]
      properties:
        analyze: { type: boolean }
    MigrationPlan:
      type: object
      required: [index, sql, explainable]
      properties:
        index: { type: integer }
        sql: { type: string }
        explainable: { type: boolean }
        notice: { type: string }
        plan: {}

    SchemaDiffRequest:
      type: object
      required: [against, direction]
      additionalProperties: false
      properties:
        against:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type: { type: string, enum: [database, snapshot] }
            id: { type: integer, format: int64, minimum: 1 }
        direction:
          type: string
          enum: [toTarget]
          description: Arah SQL yang dihasilkan; "toTarget" membuat databaseId menyamai against

    SchemaDiffChange:
      type: object
      required: [kind, schema, table, name, destructive]
      properties:
        kind:
          type: string
          enum: [add_table, drop_table, add_column, drop_column, alter_column,
                 add_constraint, drop_constraint, add_index, drop_index]
        schema: { type: string }
        table: { type: string }
        name: { type: string }
        destructive:
          type: boolean
          description: true untuk drop table/kolumn, pengetatan nullable, atau alter kolumn identitas
        tableDef: { $ref: '#/components/schemas/ExplorerTable' }
        column: { $ref: '#/components/schemas/ExplorerColumn' }
        previous: { $ref: '#/components/schemas/ExplorerColumn' }
        constraint: { $ref: '#/components/schemas/ExplorerConstraint' }
        index: { $ref: '#/components/schemas/ExplorerIndex' }

    SchemaDiffResult:
      type: object
      required: [changes, sql, warnings]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SchemaDiffChange' }
        sql:
          type: string
          description: Statement urut aman dipisah ";\n"; kosong bila tanpa perubahan
        warnings:
          type: array
          items: { type: string }

